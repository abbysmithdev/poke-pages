<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print &amp; Color</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFDF6;
  --kraft:#E9E1CE;
  --kraft-line:#CDBFA2;
  --ink:#1B2A41;
  --ink-soft:#5B6B80;
  --red:#E5473E;
  --yellow:#F5C518;
  --blue:#2D7DD2;
  --green:#4CAF6D;
  --shadow:0 2px 0 rgba(27,42,65,.16);
  --r:18px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:radial-gradient(circle at 1px 1px, rgba(27,42,65,.055) 1px, transparent 0);
  background-size:22px 22px;
  color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif;
  font-size:17px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 28px;margin-bottom:26px}
.eyebrow{
  font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px
}
h1{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(30px,5.4vw,46px);
  line-height:1.02;letter-spacing:-.02em;margin:0;max-width:11ch
}
h1 .accent{color:var(--red)}

.tally{margin-left:auto;min-width:210px}
.tally-nums{
  font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);
  display:flex;justify-content:space-between;margin-bottom:7px
}
.tally-nums b{color:var(--ink)}
.tally-bar{height:9px;border-radius:99px;background:var(--kraft);overflow:hidden}
.tally-fill{height:100%;width:0;border-radius:99px;background:var(--green);transition:width .5s ease}

/* ---------- controls ---------- */
.controls{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:12px;margin-bottom:24px;
  background:#fff;border:2px solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow)
}
.search{
  flex:1 1 230px;min-width:180px;border:none;background:transparent;
  font-family:'Nunito';font-size:19px;font-weight:700;padding:8px 10px;color:var(--ink)
}
.search::placeholder{color:#A9B4C2;font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:8px 15px;border-radius:99px;font-weight:800;font-size:14px;
  background:var(--kraft);color:var(--ink);transition:transform .12s ease
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:hover{transform:translateY(-1px)}
.chip .n{font-family:'Space Mono',monospace;font-size:12px;opacity:.65;margin-left:5px}

/* ---------- album grid ---------- */
.album{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  list-style:none;padding:0;margin:0
}
.slot{
  position:relative;width:100%;display:block;text-align:center;
  padding:14px 8px 12px;border-radius:var(--r);
  background:#fff;border:2px solid var(--ink);box-shadow:var(--shadow);
  transition:transform .14s ease, box-shadow .14s ease
}
.slot:hover{transform:translateY(-3px);box-shadow:0 6px 0 rgba(27,42,65,.16)}
.slot .art{
  width:100%;aspect-ratio:1;object-fit:contain;display:block;
  image-rendering:auto;transition:filter .35s ease, opacity .35s ease
}
.slot .dex{
  font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);
  display:block;margin-top:2px
}
.slot .nm{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;
  line-height:1.15;display:block;margin-top:1px;word-break:break-word
}
.slot .count{
  position:absolute;top:-9px;right:-7px;min-width:26px;height:26px;
  border-radius:99px;background:var(--red);color:#fff;border:2px solid var(--ink);
  font-family:'Space Mono',monospace;font-size:12px;
  display:grid;place-items:center;padding:0 5px
}

.slot.noart .art{display:none}
.slot.noart::before{
  content:attr(data-init);display:grid;place-items:center;
  width:100%;aspect-ratio:1;border-radius:12px;background:var(--kraft);
  font-family:'Fredoka',sans-serif;font-size:36px;color:var(--kraft-line)
}

/* the signature: unfilled pockets are silhouettes in kraft sleeves */
.slot.empty{background:var(--kraft);border-style:dashed;border-color:var(--kraft-line);box-shadow:none}
.slot.empty .art{filter:brightness(0);opacity:.19}
.slot.empty .nm,.slot.empty .dex{color:var(--ink-soft)}
.slot.empty:hover .art{opacity:.3}

/* ---------- detail sheet ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(27,42,65,.55);
  display:none;place-items:center;padding:18px;z-index:40;overflow-y:auto
}
.scrim.open{display:grid}
.sheet{
  width:min(680px,100%);background:var(--paper);border:3px solid var(--ink);
  border-radius:24px;padding:24px;box-shadow:0 10px 0 rgba(27,42,65,.28);margin:auto
}
.sheet-top{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.sheet-top img{width:104px;height:104px;object-fit:contain;flex:none}
.sheet-top h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:31px;margin:0;line-height:1}
.sheet-top .dex{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft)}
.close{
  margin-left:auto;align-self:flex-start;width:40px;height:40px;border-radius:99px;
  background:var(--ink);color:var(--paper);font-size:20px;font-weight:700;line-height:1;flex:none
}

.pages{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:0;padding:0;list-style:none}
.page-card{
  display:block;background:#fff;border:2px solid var(--ink);border-radius:14px;
  overflow:hidden;text-decoration:none;box-shadow:var(--shadow);
  transition:transform .14s ease
}
.page-card:hover{transform:translateY(-3px)}
.page-thumb{
  width:100%;aspect-ratio:4/5;background:var(--kraft);display:grid;place-items:center;
  border-bottom:2px solid var(--ink);font-size:30px;color:var(--kraft-line)
}
.page-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.page-meta{padding:9px 11px 11px}
.page-meta .t{font-weight:800;font-size:14px;line-height:1.25;display:block}
.page-meta .s{font-size:12px;color:var(--ink-soft);display:block;margin-top:2px}
.tag{
  display:inline-block;margin-top:6px;padding:2px 8px;border-radius:99px;
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em
}
.tag.easy{background:var(--green);color:#fff}
.tag.medium{background:var(--yellow);color:var(--ink)}
.tag.detailed{background:var(--blue);color:#fff}

.blank{
  border:2px dashed var(--kraft-line);border-radius:16px;background:var(--kraft);
  padding:26px 20px;text-align:center
}
.blank p{margin:0;font-weight:700}
.blank span{display:block;margin-top:5px;font-size:15px;color:var(--ink-soft);font-weight:600}

/* ---------- curate mode ---------- */
.curate-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--ink);color:var(--paper);
  padding:11px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap
}
.curate-bar .lbl{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.mini{
  padding:7px 14px;border-radius:99px;background:var(--paper);color:var(--ink);
  font-weight:800;font-size:14px
}
.mini.ghost{background:transparent;color:var(--paper);border:2px solid rgba(255,253,246,.45)}
.curate-toggle{
  margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);padding:6px 10px;border-radius:8px
}
.curate-toggle:hover{color:var(--ink);background:var(--kraft)}

.addform{margin-top:20px;border-top:2px dashed var(--kraft-line);padding-top:18px;display:none}
body.curating .addform{display:block}
.addform h3{font-family:'Fredoka';font-size:17px;margin:0 0 11px}
.addform .row{display:grid;gap:9px;grid-template-columns:1fr 1fr}
.addform input,.addform select{
  width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:11px;
  font-family:'Nunito';font-size:15px;font-weight:600;background:#fff;color:var(--ink)
}
.addform .full{grid-column:1/-1}
.addform .go{background:var(--red);color:#fff;padding:11px 20px;border-radius:99px;font-weight:800;margin-top:10px}
.drop{margin-top:9px;font-size:13px;color:var(--ink-soft);font-weight:600}
.rm{
  position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:99px;
  background:var(--ink);color:#fff;font-size:14px;line-height:1;display:none;place-items:center;z-index:2
}
body.curating .page-wrap .rm{display:grid}
.page-wrap{position:relative}

body:not(.curating) .curate-bar{display:none}
body.curating .wrap{padding-bottom:120px}

@media (max-width:560px){
  .album{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
  .tally{margin-left:0;width:100%}
  .sheet{padding:18px;border-radius:20px}
  .sheet-top img{width:76px;height:76px}
  .addform .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="eyebrow">Print &amp; Color</p>
      <h1>Pick a <span class="accent">Pokémon</span> to color</h1>
    </div>
    <div class="tally">
      <div class="tally-nums"><span>Ready to print</span><span><b id="tallyDone">0</b> / 151</span></div>
      <div class="tally-bar"><div class="tally-fill" id="tallyFill"></div></div>
    </div>
  </header>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Type a name..." aria-label="Search by name">
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" data-filter="all" aria-pressed="true">All <span class="n" id="cAll">151</span></button>
      <button class="chip" data-filter="ready" aria-pressed="false">Ready <span class="n" id="cReady">0</span></button>
      <button class="chip" data-filter="empty" aria-pressed="false">Needs pages <span class="n" id="cEmpty">151</span></button>
    </div>
    <button class="curate-toggle" id="curateToggle">Curate</button>
  </div>

  <ul class="album" id="album"></ul>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetName">
  <div class="sheet">
    <div class="sheet-top">
      <img id="sheetArt" alt="">
      <div>
        <span class="dex" id="sheetDex"></span>
        <h2 id="sheetName"></h2>
      </div>
      <button class="close" id="closeBtn" aria-label="Close">&times;</button>
    </div>
    <div id="sheetBody"></div>
    <div class="addform">
      <h3>Add a page</h3>
      <div class="row">
        <input class="full" id="fUrl" type="url" placeholder="Direct link to the PDF or image">
        <input id="fTitle" type="text" placeholder="Short title">
        <input id="fSource" type="text" placeholder="Site name">
        <input id="fThumb" type="url" placeholder="Thumbnail path (optional)">
        <select id="fDiff">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="detailed">Detailed</option>
        </select>
      </div>
      <button class="go" id="addBtn">Add page</button>
      <p class="drop">Added here for this session only. Use Copy manifest below, then paste into the PAGES object in this file.</p>
    </div>
  </div>
</div>

<div class="curate-bar">
  <span class="lbl">Curating</span>
  <button class="mini" id="copyBtn">Copy manifest</button>
  <button class="mini ghost" id="nextBtn">Jump to next empty</button>
  <button class="mini ghost" id="exitBtn">Done</button>
</div>

<script>
/* =====================================================================
   THE ONLY THING YOU EDIT.
   Keyed by Pokedex number. Each page needs a url; everything else optional.
     url    - direct link to the printable PDF or image
     title  - what the kids see under the thumbnail
     source - which site it came from, so you can credit and re-find it
     thumb  - local path to your generated preview, e.g. "thumbs/pika-01.webp"
     diff   - "easy" | "medium" | "detailed"

   Seeded with 57 printables across 28 Kanto Pokemon, pulled from Monday
   Mandala. Every url is a direct link to the PDF, so the print dialog is
   one tap away. Every thumb is that site's own preview image.

   Their slug pattern, if you want to add more by hand:
     PDF   -> /wp-content/uploads/{Slug}.pdf

/* Kanto 151, in dex order. Index 0 is #001. */
const NAMES = ["Bulbasaur","Ivysaur","Venusaur","Charmander","Charmeleon","Charizard","Squirtle","Wartortle","Blastoise","Caterpie","Metapod","Butterfree","Weedle","Kakuna","Beedrill","Pidgey","Pidgeotto","Pidgeot","Rattata","Raticate","Spearow","Fearow","Ekans","Arbok","Pikachu","Raichu","Sandshrew","Sandslash","Nidoran\u2640","Nidorina","Nidoqueen","Nidoran\u2642","Nidorino","Nidoking","Clefairy","Clefable","Vulpix","Ninetales","Jigglypuff","Wigglytuff","Zubat","Golbat","Oddish","Gloom","Vileplume","Paras","Parasect","Venonat","Venomoth","Diglett","Dugtrio","Meowth","Persian","Psyduck","Golduck","Mankey","Primeape","Growlithe","Arcanine","Poliwag","Poliwhirl","Poliwrath","Abra","Kadabra","Alakazam","Machop","Machoke","Machamp","Bellsprout","Weepinbell","Victreebel","Tentacool","Tentacruel","Geodude","Graveler","Golem","Ponyta","Rapidash","Slowpoke","Slowbro","Magnemite","Magneton","Farfetch'd","Doduo","Dodrio","Seel","Dewgong","Grimer","Muk","Shellder","Cloyster","Gastly","Haunter","Gengar","Onix","Drowzee","Hypno","Krabby","Kingler","Voltorb","Electrode","Exeggcute","Exeggutor","Cubone","Marowak","Hitmonlee","Hitmonchan","Lickitung","Koffing","Weezing","Rhyhorn","Rhydon","Chansey","Tangela","Kangaskhan","Horsea","Seadra","Goldeen","Seaking","Staryu","Starmie","Mr. Mime","Scyther","Jynx","Electabuzz","Magmar","Pinsir","Tauros","Magikarp","Gyarados","Lapras","Ditto","Eevee","Vaporeon","Jolteon","Flareon","Porygon","Omanyte","Omastar","Kabuto","Kabutops","Aerodactyl","Snorlax","Articuno","Zapdos","Moltres","Dratini","Dragonair","Dragonite","Mewtwo","Mew"];

const ART = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
const pad = id => String(id).padStart(3,"0");
const pagesFor = id => PAGES[id] || [];

let filter = "all", query = "", openId = null;

const $ = s => document.querySelector(s);
const album = $("#album");

function render(){
  const q = query.trim().toLowerCase();
  album.innerHTML = "";
  const frag = document.createDocumentFragment();

  NAMES.forEach((name, i) => {
    const id = i + 1;
    const n = pagesFor(id).length;
    if(filter === "ready" && n === 0) return;
    if(filter === "empty" && n > 0) return;
    if(q && !name.toLowerCase().includes(q) && !pad(id).includes(q)) return;

    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "slot" + (n ? "" : " empty");
    b.dataset.id = id;
    b.dataset.init = name[0];
    b.setAttribute("aria-label", n
      ? `${name}, ${n} page${n>1?"s":""} to print`
      : `${name}, no pages yet`);
    b.innerHTML = `
      ${n ? `<span class="count">${n}</span>` : ""}
      <img class="art" src="${ART(id)}" alt="" loading="lazy" decoding="async" onerror="this.closest('.slot').classList.add('noart')">
      <span class="dex">#${pad(id)}</span>
      <span class="nm">${name}</span>`;
    li.appendChild(b);
    frag.appendChild(li);
  });

  album.appendChild(frag);
  if(!album.children.length){
    album.innerHTML = `<li style="grid-column:1/-1"><div class="blank"><p>Nothing matches that.</p><span>Try a different name, or switch the filter back to All.</span></div></li>`;
  }
  updateTally();
}

function updateTally(){
  const done = NAMES.reduce((a,_,i) => a + (pagesFor(i+1).length ? 1 : 0), 0);
  $("#tallyDone").textContent = done;
  $("#tallyFill").style.width = (done/151*100) + "%";
  $("#cReady").textContent = done;
  $("#cEmpty").textContent = 151 - done;
}

/* ---------- detail sheet ---------- */
function openSheet(id){
  openId = id;
  const name = NAMES[id-1];
  $("#sheetArt").src = ART(id);
  $("#sheetDex").textContent = "#" + pad(id);
  $("#sheetName").textContent = name;
  paintPages();
  $("#scrim").classList.add("open");
  document.body.style.overflow = "hidden";
  $("#closeBtn").focus();
}

function paintPages(){
  const list = pagesFor(openId);
  const body = $("#sheetBody");
  if(!list.length){
    body.innerHTML = `<div class="blank"><p>No pages for ${NAMES[openId-1]} yet.</p><span>Pick a different Pokémon for now.</span></div>`;
    return;
  }
  body.innerHTML = `<ul class="pages">` + list.map((p,idx) => `
    <li class="page-wrap">
      <button class="rm" data-idx="${idx}" aria-label="Remove this page">&times;</button>
      <a class="page-card" href="${p.url}" target="_blank" rel="noopener noreferrer">
        <div class="page-thumb">${p.thumb ? `<img src="${p.thumb}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='&#9634;'">` : "&#9634;"}</div>
        <div class="page-meta">
          <span class="t">${p.title || "Untitled page"}</span>
          <span class="s">${p.source || "Unknown source"}</span>
          ${p.diff ? `<span class="tag ${p.diff}">${p.diff}</span>` : ""}
        </div>
      </a>
    </li>`).join("") + `</ul>`;
}

function closeSheet(){
  $("#scrim").classList.remove("open");
  document.body.style.overflow = "";
  const back = album.querySelector(`.slot[data-id="${openId}"]`);
  openId = null;
  if(back) back.focus();
}

/* ---------- events ---------- */
album.addEventListener("click", e => {
  const s = e.target.closest(".slot");
  if(s) openSheet(+s.dataset.id);
});

$("#search").addEventListener("input", e => { query = e.target.value; render(); });

document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  filter = c.dataset.filter;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
  render();
}));

$("#closeBtn").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", e => { if(e.target === $("#scrim")) closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && openId) closeSheet(); });

/* ---------- curate ---------- */
function setCurating(on){
  document.body.classList.toggle("curating", on);
  $("#curateToggle").textContent = on ? "Curating" : "Curate";
}
$("#curateToggle").addEventListener("click", () => setCurating(!document.body.classList.contains("curating")));
$("#exitBtn").addEventListener("click", () => setCurating(false));

$("#addBtn").addEventListener("click", () => {
  const url = $("#fUrl").value.trim();
  if(!url || !openId){ $("#fUrl").focus(); return; }
  (PAGES[openId] = PAGES[openId] || []).push({
    url,
    title:  $("#fTitle").value.trim()  || null,
    source: $("#fSource").value.trim() || null,
    thumb:  $("#fThumb").value.trim()  || null,
    diff:   $("#fDiff").value
  });
  ["#fUrl","#fTitle","#fThumb"].forEach(s => $(s).value = "");
  paintPages(); render();
});

$("#sheetBody").addEventListener("click", e => {
  const rm = e.target.closest(".rm");
  if(!rm) return;
  PAGES[openId].splice(+rm.dataset.idx, 1);
  if(!PAGES[openId].length) delete PAGES[openId];
  paintPages(); render();
});

$("#copyBtn").addEventListener("click", async () => {
  const keys = Object.keys(PAGES).map(Number).sort((a,b) => a-b);
  const out = "const PAGES = {\n" + keys.map(k =>
    `  ${k}: [\n` + PAGES[k].map(p =>
      `    {url:${JSON.stringify(p.url)}, title:${JSON.stringify(p.title)}, source:${JSON.stringify(p.source)}, thumb:${JSON.stringify(p.thumb)}, diff:${JSON.stringify(p.diff)}}`
    ).join(",\n") + `\n  ]`
  ).join(",\n") + "\n};";
  try{
    await navigator.clipboard.writeText(out);
    $("#copyBtn").textContent = "Copied";
    setTimeout(() => $("#copyBtn").textContent = "Copy manifest", 1400);
  }catch{
    console.log(out);
    $("#copyBtn").textContent = "See console";
    setTimeout(() => $("#copyBtn").textContent = "Copy manifest", 1800);
  }
});

$("#nextBtn").addEventListener("click", () => {
  const start = openId || 0;
  let next = null;
  for(let i = start + 1; i <= 151; i++) if(!pagesFor(i).length){ next = i; break; }
  if(next === null) for(let i = 1; i <= 151; i++) if(!pagesFor(i).length){ next = i; break; }
  if(next === null) return;
  if(openId) closeSheet();
  openSheet(next);
});

render();
</script>
